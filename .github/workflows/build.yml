name: build

# Every push to main publishes a new release so the latest build is always
# on the Releases page and ppgmods' self-update can find it. Within a
# version series (v0.2, v0.3, ...) the first build after the series begins
# is .0 and every later push is the next patch, counted from the series'
# tags on the repository. Pushing a tag like v1.2.3 publishes that exact
# version instead.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job can write (it publishes the
# release that every installed copy updates itself from).
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Window toolkit headers (the native window uses OpenGL)
        run: sudo apt-get update -q && sudo apt-get install -y -q libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - run: go vet ./...
      - run: go test ./...

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Pick version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            v="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_REF}" = refs/heads/main ] && [ "${GITHUB_EVENT_NAME}" = push ]; then
            # The 0.3 series begins with profiles, mod lists and the Nexus
            # hand-over. The patch number is one more than the newest v0.3.*
            # tag, so this push becomes v0.3.0 and later pushes count up. Counting from
            # tags (not the run number) keeps pull-request builds, which
            # also advance that number, from skewing the version.
            last=$(git ls-remote --tags "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" 'refs/tags/v0.3.*' \
              | grep -oE 'v0\.3\.[0-9]+' | cut -d. -f3 | sort -n | tail -1)
            v="v0.3.$(( ${last:--1} + 1 ))"
          else
            v="v0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building $v"

  # The native window (Fyne) needs cgo, so each OS builds its own binary:
  # Windows amd64 on Windows, Linux amd64 on Linux. The arm64 builds are
  # built without cgo and show the browser window instead.
  build-linux:
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      # Its own build cache: release builds use -trimpath, so the test job's
      # cache never matches them and the window toolkit's C code was
      # compiled from scratch every time.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-linux-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            release-linux-${{ hashFiles('go.sum') }}-
            release-linux-
      - name: Window toolkit headers
        run: sudo apt-get update -q && sudo apt-get install -y -q libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: Windows icon and version info (arm64)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3 # module checksum verified by sum.golang.org
          num=$(echo "${VERSION#v}" | sed -E 's/^([0-9]+)\.([0-9]+)\.([0-9]+).*/\1.\2.\3/')
          case "$num" in *[!0-9.]*|"") num=0.0.0 ;; esac
          go-winres simply --arch arm64 --out cmd/ppgmods/rsrc \
            --icon internal/desktop/icons/icon-256.png --manifest gui \
            --product-name "PPG Mod Manager" --file-description "PPG Mod Manager" \
            --original-filename ppgmods.exe --product-version "$num.0" --file-version "$num.0"
      - name: Build binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir dist
          flags="-s -w -X main.version=${VERSION}"
          # The three builds run side by side; each must succeed.
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$flags" -o dist/ppgmods-linux-amd64 ./cmd/ppgmods & a=$!
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$flags" -o dist/ppgmods-linux-arm64 ./cmd/ppgmods & b=$!
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags "$flags -H windowsgui" -o dist/ppgmods-windows-arm64.exe ./cmd/ppgmods & c=$!
          wait $a && wait $b && wait $c
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: part-linux
          path: dist/*

  build-windows:
    needs: [test, version]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Windows icon and version info
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3 # module checksum verified by sum.golang.org
          num=$(echo "${VERSION#v}" | sed -E 's/^([0-9]+)\.([0-9]+)\.([0-9]+).*/\1.\2.\3/')
          case "$num" in *[!0-9.]*|"") num=0.0.0 ;; esac
          go-winres simply --arch amd64 --out cmd/ppgmods/rsrc \
            --icon internal/desktop/icons/icon-256.png --manifest gui \
            --product-name "PPG Mod Manager" --file-description "PPG Mod Manager" \
            --original-filename ppgmods.exe --product-version "$num.0" --file-version "$num.0"
      - name: Build binary
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir dist
          # Windows builds are GUI programs: no console window on double-click.
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.version=${VERSION}" \
            -o dist/ppgmods-windows-amd64.exe ./cmd/ppgmods
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: part-windows
          path: dist/*

  build:
    needs: [version, build-linux, build-windows]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: part-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ppgmods-${{ needs.version.outputs.version }}
          path: dist/*

  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ppgmods-${{ needs.build.outputs.version }}
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ppgmods ${{ needs.build.outputs.version }}
          generate_release_notes: true
          make_latest: true
          body: |
            **Windows:** download `ppgmods-windows-amd64.exe` and double-click it, then click **Install** in the banner. It adds PPG Mod Manager to the Start menu and desktop (no admin needed); you can delete the download afterwards. Windows SmartScreen may warn because the program is not code-signed: choose "More info" → "Run anyway".
            **Linux:** download `ppgmods-linux-amd64`, run `chmod +x ppgmods-linux-amd64 && ./ppgmods-linux-amd64`, then click **Install**. It goes to `~/.local/bin` with an application-menu entry and desktop shortcut.
            Already installed? The app checks for new releases and shows an **Update now** banner.

            Verify downloads against `SHA256SUMS.txt`.
          files: dist/*
