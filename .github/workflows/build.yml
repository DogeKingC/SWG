name: build

# Every push to main publishes a new release (v0.1.<run number>) so the
# latest build is always on the Releases page and ppgmods' self-update can
# find it. Pushing a tag like v1.2.3 publishes that exact version instead.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job can write (it publishes the
# release that every installed copy updates itself from).
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Pick version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            v="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_REF}" = refs/heads/main ] && [ "${GITHUB_EVENT_NAME}" = push ]; then
            v="v0.1.${GITHUB_RUN_NUMBER}"
          else
            v="v0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building $v"
      - name: Windows icon and version info
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3 # module checksum verified by sum.golang.org
          num=$(echo "${VERSION#v}" | sed -E 's/^([0-9]+)\.([0-9]+)\.([0-9]+).*/\1.\2.\3/')
          case "$num" in *[!0-9.]*|"") num=0.0.0 ;; esac
          go-winres simply --arch amd64,arm64 --out cmd/ppgmods/rsrc \
            --icon internal/desktop/icons/icon-256.png --manifest gui \
            --product-name "PPG Mod Manager" --file-description "PPG Mod Manager" \
            --original-filename ppgmods.exe --product-version "$num.0" --file-version "$num.0"
      - name: Build binaries
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; extra=""
            # Windows builds are GUI programs: no console window on double-click.
            [ "$os" = windows ] && ext=".exe" && extra="-H windowsgui"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w $extra -X main.version=${VERSION}" \
              -o "dist/ppgmods-${os}-${arch}${ext}" ./cmd/ppgmods
          done
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ppgmods-${{ steps.ver.outputs.version }}
          path: dist/*

  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ppgmods-${{ needs.build.outputs.version }}
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ppgmods ${{ needs.build.outputs.version }}
          generate_release_notes: true
          make_latest: true
          body: |
            **Windows:** download `ppgmods-windows-amd64.exe` and double-click it, then click **Install** in the banner. It adds PPG Mod Manager to the Start menu and desktop (no admin needed); you can delete the download afterwards. Windows SmartScreen may warn because the program is not code-signed: choose "More info" → "Run anyway".
            **Linux:** download `ppgmods-linux-amd64`, run `chmod +x ppgmods-linux-amd64 && ./ppgmods-linux-amd64`, then click **Install**. It goes to `~/.local/bin` with an application-menu entry and desktop shortcut.
            Already installed? The app checks for new releases and shows an **Update now** banner.

            Verify downloads against `SHA256SUMS.txt`.
          files: dist/*
